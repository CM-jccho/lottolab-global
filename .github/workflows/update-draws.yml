name: Update lottery draw data

on:
  schedule:
    # Mon / Thu / Sat at 03:00 UTC (12:00 KST) — after the Japanese Thursday draw
    - cron: "0 3 * * 1,4,6"
  workflow_dispatch:
    inputs:
      games:
        description: "Games to refresh (blank = all): kr us jp eu"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch published draws
        run: |
          if [ -n "${{ github.event.inputs.games }}" ]; then
            python3 scripts/fetch_draws.py ${{ github.event.inputs.games }}
          else
            python3 scripts/fetch_draws.py
          fi

      - name: Show data diff summary
        run: |
          for f in data/*.json; do
            python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          m = d["meta"]
          print(f'{sys.argv[1]}: {m["draw_count"]} draws, last {m["last_draw"]["date"] if m["last_draw"] else "-"}')
          PY
          done

      - name: Commit and push if changed
        run: |
          git config user.name "lottolab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new draws."
          else
            git commit -m "chore(data): update draw results ($(date -u +%Y-%m-%d))"
            git push
          fi
